[package]
authors     = [ "Markus Waas <markus@injectivelabs.org>" ]
description = "Math library for CosmWasm contracts in Injective Protocol"
edition     = "2021"
license     = "Apache-2.0"
name        = "injective-math"
readme      = "README.md"
repository  = "https://github.com/InjectiveLabs/cw-injective/tree/dev/packages/injective-math"
version     = "0.3.6"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cosmwasm-std    = { version = "3.0.5", features = ["cosmwasm_1_2", "cosmwasm_1_3", "cosmwasm_1_4", "cosmwasm_2_0", "iterator", "stargate" ] }
primitive-types = { version = "0.12.2", default-features = false }
schemars        = { version = "0.8.16" }
serde           = { version = "1.0.196", default-features = false, features = [ "derive" ] }

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = true
panic = 'abort'
rpath = false
